server { 
        listen 80; 
        server_name _;

        server_tokens off;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        charset utf-8;
        add_header X-Content-Type-Options nosniff;
        large_client_header_buffers 8 512k;
        add_header Last-Modified $date_gmt;
        add_header X-XSS-Protection "1; mode=block" always;
        #ssl_ciphers HIGH:MEDIUM:!MD5:!RC4;
        expires epoch;
        add_header Cache-Control 'no-store, no-cache, must-revalidate';
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options SAMEORIGIN;
        add_header Expect-CT 'enforce; max-age=31536000';
        # add_header Content-Security-Policy "default-src 'none'; frame-src https://emerson.okta.com https://accessemr.okta.com script-src 'self' 'unsafe-inline' 'unsafe-eval' connect-src 'self' https://emerson.okta.com https://accessemr.okta.com; img-src 'self' blob: data: https://newmy.asco.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.google.com; style-src-elem 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.google.com; font-src 'self' https://fonts.gstatic.com data:; Manifest-src 'self'" always;
        ssl_ciphers "EECDH+ECDSA+AESGCM EECDH+aRSA+AESGCM EECDH+ECDSA+SHA384 EECDH+ECDSA+SHA256 EECDH+aRSA+SHA384 EECDH+aRSA+SHA256 EECDH+aRSA+RC4 EECDH EDH+aRSA HIGH !RC4 !aNULL !eNULL !LOW !3DES !MD5 !EXP !PSK !SRP !DSS";

        location / {
            root /usr/share/nginx/html;
            try_files $uri /index.html;
        }
    }